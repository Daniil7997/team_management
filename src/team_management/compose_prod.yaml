name: team_management_prod


services:

  db:
    extends:
      file: base.yaml
      service: db
    env_file:
      - .env
    volumes:
      - db_data_prod:/var/lib/postgresql/data

  redis:
    extends:
      file: base.yaml
      service: redis
    volumes:
      - redis_data_prod:/data

  fastapi:
    extends:
      file: base.yaml
      service: fastapi
    env_file:
      - .env
    environment:
      IS_TEST_DB: "False"
    build:
      context: .
      target: "production"
    command: sh -c "alembic upgrade head && \
      uvicorn app.main:application \
      --host 0.0.0.0 \
      --port 8000 \
      --workers 2"
    ports: 
      - "8000:8000"
  

volumes:
  db_data_prod:
  redis_data_prod:


networks:
  app_network:
    driver: bridge
